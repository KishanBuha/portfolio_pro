<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Kishan Buha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-md spatial-nav">
        <div class="container">
            <a class="navbar-brand nav-brand" href="index.html">Kishan.</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1 d-flex align-items-center w-100 py-5">
        <div class="container fade-up">
            <div class="row justify-content-center">
                <div class="col-lg-10 col-xl-8">
                    
                    <div class="text-center mb-5">
                        <h1 class="hero-title mb-3" style="font-size: clamp(2.5rem, 5vw, 4rem);">Initialize Comms</h1>
                        <p class="fs-5 mx-auto" style="color: var(--text-muted); max-width: 550px;">
                            Have an idea or opportunity? Send a message below and it will route securely to <strong>kishanbuha0301@gmail.com</strong>.
                        </p>
                    </div>

                    <div class="glass-panel p-4 p-md-5">
                        <form action="https://formsubmit.co/kishanbuha0301@gmail.com" method="POST">
                            <input type="hidden" name="_captcha" value="false">
                            
                            <div class="row g-4">
                                <div class="col-md-6 d-flex flex-column">
                                    <label class="form-label">Identity</label>
                                    <input type="text" name="name" class="spatial-input" placeholder="Your Name" required>
                                    
                                    <label class="form-label mt-2">Return Node</label>
                                    <input type="email" name="email" class="spatial-input mb-0" placeholder="Your Email" required>
                                </div>
                                <div class="col-md-6 d-flex flex-column">
                                    <label class="form-label">Payload</label>
                                    <textarea name="message" class="spatial-input flex-grow-1 mb-0" style="min-height: 120px; resize: none;" placeholder="Transmission details..." required></textarea>
                                </div>
                                <div class="col-12 text-center text-md-end mt-4 pt-4" style="border-top: 1px solid var(--glass-border);">
                                    <button type="submit" class="btn-glass w-100 w-md-auto">Transmit Data</button>
                                </div>
                            </div>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.css"></script>
</body>
</html>
