<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Kishan Buha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top py-3">
        <div class="container">
            <a class="navbar-brand" href="index.html">&lt;Kishan/&gt;</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="py-5 mt-5 flex-grow-1 d-flex align-items-center">
        <div class="container py-5 reveal">
            <div class="row justify-content-center">
                <div class="col-lg-6 text-center mb-5">
                    <h2 class="hero-title mb-3" style="font-size: 3rem;">Get In Touch</h2>
                    <p style="color: var(--text-muted); font-size: 1.1rem;">Have a project in mind or just want to say hi? Send me a message!</p>
                </div>
            </div>
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="pro-card">
                        <form id="contactForm">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="name" class="form-label" style="color: var(--text-muted);">Your Name</label>
                                    <input type="text" class="form-control py-2" id="name" placeholder="Mr. XYZ" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="email" class="form-label" style="color: var(--text-muted);">Your Email</label>
                                    <input type="email" class="form-control py-2" id="email" placeholder="xyz@gmail.com" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="message" class="form-label" style="color: var(--text-muted);">Message</label>
                                <textarea class="form-control" id="message" rows="5" placeholder="How can I help you?" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-custom w-100 py-3">Send Message <i class="bi bi-send ms-2"></i></button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="py-4 text-center border-top border-secondary mt-auto">
        <div class="container">
            <p class="mb-0" style="color: var(--text-muted);">&copy; 2026 Kishan Buha.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.css"></script>
    <script src="js/script.js"></script>
</body>
</html>
