    <style>
        /* Overrides to flip the layout (Image Left, Text Right) */
        .hero-portrait {
            right: auto !important;
            left: 5% !important;
            /* Flipped shadow direction so it falls correctly to the right */
            filter: drop-shadow(15px 15px 25px rgba(0,0,0,0.5)) !important; 
        }
        .hero-content {
            /* Pushes the text block to the right side of the flex container */
            margin-left: auto; 
            position: relative;
            z-index: 10;
        }
        
        /* Mobile fixes to ensure it stacks correctly on small screens */
        @media (max-width: 992px) {
            .hero-portrait {
                left: -2rem !important;
                margin-top: -50px;
            }
            .hero-content {
                margin-left: 0;
            }
        }
    </style>
</head>
